<title id="t">Différencier, individualiser, personnaliser</title>
<desc id="d">Trois niveaux d'adaptation : différencier selon des profils, individualiser par groupes de besoin, personnaliser pour chaque élève, le plus coûteux en temps et celui que l'IA rend accessible.</desc>
