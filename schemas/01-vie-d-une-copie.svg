<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 712" width="1200" height="712" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">La vie d'une copie</title>
<desc id="d">Parcours d'une copie en trois couloirs : l'élève produit, l'IA prépare le feedback et une note confidentielle, l'enseignant·e calibre, valide et envoie ; l'élève réécrit en classe. Aucun élément ne va de l'IA à l'élève sans validation de l'enseignant·e.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="1200" height="712" rx="18" fill="#FFFFFF"/>
<text x="40" y="48" text-anchor="start" font-size="22" font-weight="700" fill="#1A1A1A">La vie d'une copie</text><text x="40" y="76" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">De la production de l'élève à sa réécriture : qui fait quoi ?</text><rect x="24" y="100" width="1152" height="140" rx="14" fill="#E3F4E6" stroke="none" stroke-width="2" fill-opacity="0.45"/><rect x="24" y="100" width="132" height="140" rx="14" fill="#E3F4E6" stroke="none" stroke-width="2" /><g transform="translate(90 156) scale(1.35)"><circle cx="0" cy="-5.5" r="5" fill="#2E7D4A"/><path d="M-9,11 C-9,3 -5,0.5 0,0.5 C5,0.5 9,3 9,11 Z" fill="#2E7D4A"/></g><text x="90" y="200" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6136">Élève</text><rect x="24" y="252" width="1152" height="150" rx="14" fill="#FDF1E3" stroke="none" stroke-width="2" fill-opacity="0.45"/><rect x="24" y="252" width="132" height="150" rx="14" fill="#FDF1E3" stroke="none" stroke-width="2" /><g transform="translate(90 313) scale(1.35)"><circle cx="0" cy="-5.5" r="5" fill="#B5762A"/><path d="M-9,11 C-9,3 -5,0.5 0,0.5 C5,0.5 9,3 9,11 Z" fill="#B5762A"/></g><g transform="translate(100.8 319.75) scale(1.35)"><circle r="6" fill="#B5762A" stroke="#fff" stroke-width="1.6"/><path d="M-3,0.2 L-0.8,2.4 L3.2,-2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="90" y="357" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">Enseignant·e</text><rect x="24" y="414" width="1152" height="270" rx="14" fill="#E8F0FE" stroke="none" stroke-width="2" fill-opacity="0.45"/><rect x="24" y="414" width="132" height="270" rx="14" fill="#E8F0FE" stroke="none" stroke-width="2" /><g transform="translate(90 535) scale(1.35)"><path d="M-1,-11 C0,-3.5 2.5,-1 10,0 C2.5,1 0,3.5 -1,11 C-2,3.5 -4.5,1 -12,0 C-4.5,-1 -2,-3.5 -1,-11 Z" fill="#4A6FA5"/><path d="M8,-11 C8.4,-8.4 9.4,-7.4 12,-7 C9.4,-6.6 8.4,-5.6 8,-3 C7.6,-5.6 6.6,-6.6 4,-7 C6.6,-7.4 7.6,-8.4 8,-11 Z" fill="#4A6FA5"/></g><text x="90" y="579" text-anchor="middle" font-size="16" font-weight="700" fill="#2D5089">IA</text><path d="M256,212 V327 H345" fill="none" stroke="#2E7D4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-el)"/><path d="M498,327 H560 V458" fill="none" stroke="#B5762A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ens)"/><path d="M635,521 H659 V470 H680" fill="none" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ia)"/><path d="M659,521 V572 H680" fill="none" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ia)"/><path d="M758,433 V378" fill="none" stroke="#A33333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-conf)"/><path d="M833,572 H905 V378" fill="none" stroke="#4A6FA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ia)"/><path d="M945,375 V640 H560 V584" fill="none" stroke="#B5762A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah-ens)"/><path d="M1000,327 H1036" fill="none" stroke="#B5762A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ens)"/><path d="M1104,279 V214" fill="none" stroke="#B5762A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ens)"/><text x="758" y="669.6" text-anchor="middle" font-size="16" font-weight="400" fill="#7E4E14">seuils ajustés : l'IA régénère tout le lot</text><rect x="181" y="128" width="150" height="84" rx="12" fill="#fff" stroke="#2E7D4A" stroke-width="2" /><text x="256" y="155.1" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6136">Écrit sa copie</text><text x="256" y="175.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">en classe, texte</text><text x="256" y="196.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">ou photo</text><rect x="348" y="279" width="150" height="96" rx="12" fill="#fff" stroke="#B5762A" stroke-width="2" /><text x="423" y="312.1" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">Pseudonymise</text><text x="423" y="332.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">remplace les noms</text><text x="423" y="353.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">par des numéros</text><rect x="485" y="460" width="150" height="122" rx="12" fill="#fff" stroke="#4A6FA5" stroke-width="2" /><text x="560" y="495.9" text-anchor="middle" font-size="16" font-weight="700" fill="#2D5089">Transcrit</text><text x="560" y="516.4" text-anchor="middle" font-size="16" font-weight="700" fill="#2D5089">et corrige</text><text x="560" y="536.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">applique la grille</text><text x="560" y="557.3" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">à chaque copie</text><rect x="683" y="433" width="150" height="74" rx="12" fill="#FBE4E4" stroke="#A33333" stroke-width="2" /><text x="758" y="455.1" text-anchor="middle" font-size="16" font-weight="700" fill="#922B2B">Note</text><text x="758" y="475.6" text-anchor="middle" font-size="16" font-weight="700" fill="#922B2B">confidentielle</text><text x="758" y="496.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">pour l'enseignant·e</text><rect x="683" y="535" width="150" height="74" rx="12" fill="#fff" stroke="#4A6FA5" stroke-width="2" /><text x="758" y="567.4" text-anchor="middle" font-size="16" font-weight="700" fill="#2D5089">Fichier élève</text><text x="758" y="587.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">projet de feedback</text><rect x="683" y="279" width="150" height="96" rx="12" fill="#FBE4E4" stroke="#A33333" stroke-width="2" /><text x="758" y="301.9" text-anchor="middle" font-size="16" font-weight="700" fill="#922B2B">Tranche les</text><text x="758" y="322.4" text-anchor="middle" font-size="16" font-weight="700" fill="#922B2B">cas sensibles</text><text x="758" y="342.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">entretien, réponse</text><text x="758" y="363.3" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">humaine</text><rect x="850" y="279" width="150" height="96" rx="12" fill="#fff" stroke="#B5762A" stroke-width="2" /><text x="925" y="301.9" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">Calibre</text><text x="925" y="322.4" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">puis valide</text><text x="925" y="342.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">3 copies, puis</text><text x="925" y="363.3" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">chaque fichier</text><rect x="1039" y="279" width="130" height="96" rx="12" fill="#fff" stroke="#B5762A" stroke-width="2" /><text x="1104" y="312.1" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">Envoie</text><text x="1104" y="332.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">le message</text><text x="1104" y="353.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">individuel</text><rect x="1039" y="128" width="130" height="84" rx="12" fill="#fff" stroke="#2E7D4A" stroke-width="2" /><text x="1104" y="165.4" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6136">Lit et réécrit</text><text x="1104" y="185.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">en classe</text><circle cx="185" cy="132" r="13" fill="#2E7D4A"/><text x="185" y="137.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><circle cx="352" cy="283" r="13" fill="#B5762A"/><text x="352" y="288.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><circle cx="489" cy="464" r="13" fill="#4A6FA5"/><text x="489" y="469.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><circle cx="687" cy="539" r="13" fill="#4A6FA5"/><text x="687" y="544.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><circle cx="854" cy="283" r="13" fill="#B5762A"/><text x="854" y="288.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><circle cx="1043" cy="283" r="13" fill="#B5762A"/><text x="1043" y="288.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text><circle cx="1043" cy="132" r="13" fill="#2E7D4A"/><text x="1043" y="137.5" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">7</text><circle cx="687" cy="437" r="13" fill="#A33333"/><g transform="translate(687 436) scale(0.72)"><path d="M-5,-2 V-6 a5,5 0 0 1 10,0 V-2" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="-8" y="-2" width="16" height="13" rx="2.5" fill="#fff"/><circle cx="0" cy="4" r="1.8" fill="#fff"/></g><circle cx="687" cy="283" r="13" fill="#A33333"/><g transform="translate(687 282) scale(0.72)"><path d="M-5,-2 V-6 a5,5 0 0 1 10,0 V-2" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="-8" y="-2" width="16" height="13" rx="2.5" fill="#fff"/><circle cx="0" cy="4" r="1.8" fill="#fff"/></g><path d="M758,279 V258" fill="none" stroke="#A33333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="758" cy="246" r="12" fill="#fff" stroke="#A33333" stroke-width="2.5"/><path d="M750,238 L766,254" stroke="#A33333" stroke-width="2.5"/><text x="778" y="230" text-anchor="start" font-size="16" font-weight="700" fill="#922B2B">jamais transmise à l'élève</text><text x="320" y="506.1" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">L'IA ne reçoit que des copies</text><text x="320" y="526.6" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">pseudonymisées, avec la grille</text><text x="320" y="547.1" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">et le document source.</text><text x="660" y="157.4" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Aucune flèche ne va de l'IA à l'élève.</text><text x="660" y="177.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">Tout passe par l'enseignant·e, qui valide et envoie.</text>
</svg>
