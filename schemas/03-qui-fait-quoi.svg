<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 668" width="960" height="668" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">Qui fait quoi : l'IA prépare, l'enseignant·e décide</title>
<desc id="d">Répartition des tâches : l'IA transcrit, corrige, applique la grille et signale ; l'enseignant·e fixe la grille, calibre, tranche, valide et envoie.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="668" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Qui fait quoi ?</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Chaque tâche préparée par l'IA aboutit à une décision de l'enseignant·e.</text><rect x="40" y="96" width="390" height="50" rx="12" fill="#4A6FA5" stroke="none" stroke-width="2" /><g transform="translate(72 121) scale(0.95)"><path d="M-1,-11 C0,-3.5 2.5,-1 10,0 C2.5,1 0,3.5 -1,11 C-2,3.5 -4.5,1 -12,0 C-4.5,-1 -2,-3.5 -1,-11 Z" fill="#fff"/><path d="M8,-11 C8.4,-8.4 9.4,-7.4 12,-7 C9.4,-6.6 8.4,-5.6 8,-3 C7.6,-5.6 6.6,-6.6 4,-7 C6.6,-7.4 7.6,-8.4 8,-11 Z" fill="#fff"/></g><text x="96" y="128" text-anchor="start" font-size="20" font-weight="700" fill="#fff">L'IA prépare</text><rect x="530" y="96" width="390" height="50" rx="12" fill="#B5762A" stroke="none" stroke-width="2" /><g transform="translate(560 121) scale(0.95)"><circle cx="0" cy="-5.5" r="5" fill="#fff"/><path d="M-9,11 C-9,3 -5,0.5 0,0.5 C5,0.5 9,3 9,11 Z" fill="#fff"/></g><g transform="translate(567.6 125.75) scale(0.95)"><circle r="6" fill="#fff" stroke="#fff" stroke-width="1.6"/><path d="M-3,0.2 L-0.8,2.4 L3.2,-2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="586" y="128" text-anchor="start" font-size="20" font-weight="700" fill="#fff">L'enseignant·e décide</text><rect x="40" y="168" width="390" height="58" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5" /><text x="60" y="202.6" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Transcrit les copies manuscrites</text><path d="M438,197 H520" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="530" y="168" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="202.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Vérifie la transcription sur 2 ou 3 copies</text><rect x="40" y="242" width="390" height="58" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5" /><text x="60" y="276.6" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Applique la grille à chaque copie</text><path d="M438,271 H520" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="530" y="242" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="276.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Fixe la grille et calibre les seuils</text><rect x="40" y="316" width="390" height="58" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5" /><text x="60" y="350.6" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Repère les erreurs, rédige les commentaires</text><path d="M438,345 H520" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="530" y="316" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="350.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Valide chaque fichier avec la checklist</text><rect x="40" y="390" width="390" height="58" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5" /><text x="60" y="424.6" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Signale les cas sensibles</text><path d="M438,419 H520" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="530" y="390" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="424.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Tranche : entretien, réponse humaine</text><rect x="40" y="464" width="390" height="58" rx="12" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="1.5" /><text x="60" y="498.6" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Vérifie les contenus cités</text><path d="M438,493 H520" fill="none" stroke="#5E5E5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ink)"/><rect x="530" y="464" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="498.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Contrôle les repères, ou rédige le corrigé</text><rect x="40" y="538" width="390" height="58" rx="12" fill="#fff" stroke="#4A6FA5" stroke-width="1.5" stroke-dasharray="6 6" /><text x="60" y="572.6" text-anchor="start" font-size="16" font-weight="400" fill="#2D5089">Rien : l'IA ne s'adresse jamais à l'élève</text><rect x="530" y="538" width="390" height="58" rx="12" fill="#FDF1E3" stroke="#B5762A" stroke-width="1.5" /><text x="550" y="572.6" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Envoie le message, anime la boucle de classe</text><text x="480" y="644" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">L'IA ne prend aucune décision qui atteint l'élève sans l'enseignant·e.</text>
</svg>
