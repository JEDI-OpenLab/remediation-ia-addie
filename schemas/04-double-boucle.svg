<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 850" width="960" height="850" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">La double boucle</title>
<desc id="d">Deux boucles emboîtées : la boucle de l'élève, d'une production à la suivante, et la boucle du dispositif, d'une séquence à la suivante, nourrie par les indicateurs.</desc>
