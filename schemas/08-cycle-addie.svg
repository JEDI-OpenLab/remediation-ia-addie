<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">Le cycle ADDIE, version itérative</title>
<desc id="d">Cycle ADDIE en cinq phases : Analyse, Design, Développement, Implémentation, Évaluation. L'enseignant·e décide en Analyse, Design et Évaluation ; l'IA produit sous son contrôle en Développement et Implémentation. Des retours en pointillé montrent les itérations : version refusée, seuils recalibrés, séquence suivante.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="800" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Le cycle ADDIE, version itérative</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Comment se lit le guide</text><path d="M326.3,172.5 A268,268 0 0 1 633.7,172.5 L539.7,306.8 A104,104 0 0 0 420.3,306.8 Z" fill="#FDF1E3" stroke="#B5762A" stroke-width="2"/><text x="480" y="190.5" text-anchor="middle" font-size="20" font-weight="700" fill="#7E4E14">1. Analyse</text><text x="480" y="212.2" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">besoins, contraintes,</text><text x="480" y="232.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">données</text><g transform="translate(589.3 241.5) rotate(36)"><circle r="13" fill="#fff" stroke="#5E5E5E" stroke-width="1.5"/><path d="M-4,-5 L3,0 L-4,5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M641.3,178.0 A268,268 0 0 1 736.3,470.4 L579.5,422.4 A104,104 0 0 0 542.6,308.9 Z" fill="#FDF1E3" stroke="#B5762A" stroke-width="2"/><text x="658.7986250634889" y="320.4" text-anchor="middle" font-size="20" font-weight="700" fill="#7E4E14">2. Design</text><text x="658.7986250634889" y="342.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">problématique,</text><text x="658.7986250634889" y="362.5" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">grille, feedback</text><g transform="translate(656.9 449.5) rotate(108)"><circle r="13" fill="#fff" stroke="#5E5E5E" stroke-width="1.5"/><path d="M-4,-5 L3,0 L-4,5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M733.4,479.3 A268,268 0 0 1 484.7,660.0 L481.8,496.0 A104,104 0 0 0 578.3,425.9 Z" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="2"/><text x="590.5036274309849" y="530.6" text-anchor="middle" font-size="20" font-weight="700" fill="#2D5089">3. Développement</text><text x="590.5036274309849" y="552.3" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">supports produits</text><text x="590.5036274309849" y="572.7" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">avec l'IA, filtrés</text><g transform="translate(480.0 578.0) rotate(180)"><circle r="13" fill="#fff" stroke="#5E5E5E" stroke-width="1.5"/><path d="M-4,-5 L3,0 L-4,5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M475.3,660.0 A268,268 0 0 1 226.6,479.3 L381.7,425.9 A104,104 0 0 0 478.2,496.0 Z" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="2"/><text x="369.4963725690151" y="530.6" text-anchor="middle" font-size="20" font-weight="700" fill="#2D5089">4. Implémentation</text><text x="369.4963725690151" y="552.3" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">correction et</text><text x="369.4963725690151" y="572.7" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">feedback validé</text><g transform="translate(303.1 449.5) rotate(252)"><circle r="13" fill="#fff" stroke="#5E5E5E" stroke-width="1.5"/><path d="M-4,-5 L3,0 L-4,5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M223.7,470.4 A268,268 0 0 1 318.7,178.0 L417.4,308.9 A104,104 0 0 0 380.5,422.4 Z" fill="#FDF1E3" stroke="#B5762A" stroke-width="2"/><text x="301.2013749365111" y="320.4" text-anchor="middle" font-size="20" font-weight="700" fill="#7E4E14">5. Évaluation</text><text x="301.2013749365111" y="342.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">le feedback</text><text x="301.2013749365111" y="362.5" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">a-t-il servi ?</text><g transform="translate(370.7 241.5) rotate(324)"><circle r="13" fill="#fff" stroke="#5E5E5E" stroke-width="1.5"/><path d="M-4,-5 L3,0 L-4,5" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="366.9" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">Évaluation</text><text x="480" y="387.4" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">formative</text><text x="480" y="407.8" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">à chaque</text><text x="480" y="428.3" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">itération</text><path d="M684.2,603.5 A294,294 0 0 0 769.5,340.9" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah-ink)"/><text x="780.5338591492684" y="495.2" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">version refusée</text><path d="M342.0,651.6 A294,294 0 0 0 618.0,651.6" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah-ink)"/><text x="480" y="713.6" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">seuils recalibrés</text><text x="309.54227683518286" y="163.0" text-anchor="end" font-size="16" font-weight="700" fill="#1A1A1A">séquence suivante</text><rect x="60" y="728" width="24" height="24" rx="6" fill="#FDF1E3" stroke="#B5762A" stroke-width="2" /><text x="94" y="746" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">L'enseignant·e décide</text><rect x="318" y="728" width="24" height="24" rx="6" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="2" /><text x="352" y="746" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">L'IA produit, l'enseignant·e filtre et valide</text><path d="M738,740 H782" fill="none" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#ah-ink)"/><text x="792" y="746" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">itérations</text>
