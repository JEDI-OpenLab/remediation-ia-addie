<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">L'IA enrichit, l'enseignant·e réduit</title>
<desc id="d">Entonnoir : la proposition de l'IA, chargée de groupes, de rôles, de cartes et d'un tournoi, passe trois filtres de l'enseignant·e (simplicité, faisabilité, vérification). La version retenue est une fiche unique ; la version 1 est refusée, la version 3 décline la version retenue à distance.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="690" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">L'IA enrichit, l'enseignant·e réduit</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Une séance de reprise, trois versions en une heure</text><rect x="220" y="96" width="520" height="112" rx="14" fill="#E8F0FE" stroke="#4A6FA5" stroke-width="2" /><g transform="translate(248 124) scale(0.85)"><path d="M-1,-11 C0,-3.5 2.5,-1 10,0 C2.5,1 0,3.5 -1,11 C-2,3.5 -4.5,1 -12,0 C-4.5,-1 -2,-3.5 -1,-11 Z" fill="#4A6FA5"/><path d="M8,-11 C8.4,-8.4 9.4,-7.4 12,-7 C9.4,-6.6 8.4,-5.6 8,-3 C7.6,-5.6 6.6,-6.6 4,-7 C6.6,-7.4 7.6,-8.4 8,-11 Z" fill="#4A6FA5"/></g><text x="268" y="130" text-anchor="start" font-size="16" font-weight="700" fill="#2D5089">Proposition de l'IA, enrichie</text><rect x="244" y="152" width="84.80000000000001" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="286.4" y="170" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">groupes</text><rect x="336.8" y="152" width="68" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="370.8" y="170" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">rôles</text><rect x="412.8" y="152" width="76.4" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="451" y="170" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">cartes</text><rect x="497.20000000000005" y="152" width="51.2" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="522.8000000000001" y="170" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">mur</text><rect x="244" y="186" width="194" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="341" y="204" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">tournoi de questions</text><rect x="446" y="186" width="101.60000000000001" height="26" rx="13" fill="#fff" stroke="#4A6FA5" stroke-width="1.2" /><text x="496.8" y="204" text-anchor="middle" font-size="16" font-weight="400" fill="#2D5089">diaporama</text><path d="M220,226 L740,226 L556,494 L404,494 Z" fill="#FDF1E3" stroke="#B5762A" stroke-width="2"/><g transform="translate(480 260) scale(1)"><circle cx="0" cy="-5.5" r="5" fill="#B5762A"/><path d="M-9,11 C-9,3 -5,0.5 0,0.5 C5,0.5 9,3 9,11 Z" fill="#B5762A"/></g><g transform="translate(488 265) scale(1)"><circle r="6" fill="#B5762A" stroke="#fff" stroke-width="1.6"/><path d="M-3,0.2 L-0.8,2.4 L3.2,-2" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="480" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#7E4E14">Les filtres de l'enseignant·e</text><line x1="289.1641791044776" y1="318" x2="670.8358208955224" y2="318" stroke="#B5762A" stroke-width="2" stroke-dasharray="6 5"/><text x="698.8358208955224" y="313.4" text-anchor="start" font-size="16" font-weight="700" fill="#7E4E14">Simple ?</text><text x="698.8358208955224" y="333.8" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">une tâche par bloc</text><rect x="193.16417910447763" y="305" width="68" height="26" rx="13" fill="#fff" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 4" /><text x="227.16417910447763" y="323" text-anchor="middle" font-size="16" fill="#5E5E5E" text-decoration="line-through">rôles</text><rect x="100.36417910447761" y="305" width="84.80000000000001" height="26" rx="13" fill="#fff" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 4" /><text x="142.76417910447762" y="323" text-anchor="middle" font-size="16" fill="#5E5E5E" text-decoration="line-through">tournoi</text><line x1="334.4776119402985" y1="384" x2="625.5223880597015" y2="384" stroke="#B5762A" stroke-width="2" stroke-dasharray="6 5"/><text x="653.5223880597015" y="379.4" text-anchor="start" font-size="16" font-weight="700" fill="#7E4E14">Faisable en classe ?</text><text x="653.5223880597015" y="399.8" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">temps, absents</text><rect x="255.27761194029853" y="371" width="51.2" height="26" rx="13" fill="#fff" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 4" /><text x="280.87761194029855" y="389" text-anchor="middle" font-size="16" fill="#5E5E5E" text-decoration="line-through">mur</text><rect x="162.47761194029852" y="371" width="84.80000000000001" height="26" rx="13" fill="#fff" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 4" /><text x="204.87761194029852" y="389" text-anchor="middle" font-size="16" fill="#5E5E5E" text-decoration="line-through">groupes</text><line x1="379.7910447761194" y1="450" x2="580.2089552238806" y2="450" stroke="#B5762A" stroke-width="2" stroke-dasharray="6 5"/><text x="608.2089552238806" y="445.4" text-anchor="start" font-size="16" font-weight="700" fill="#7E4E14">Contenus vérifiés ?</text><text x="608.2089552238806" y="465.8" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">documents lus par l'IA</text><rect x="275.39104477611943" y="437" width="76.4" height="26" rx="13" fill="#fff" stroke="#BDBDBD" stroke-width="1.2" stroke-dasharray="4 4" /><text x="313.5910447761194" y="455" text-anchor="middle" font-size="16" fill="#5E5E5E" text-decoration="line-through">cartes</text><rect x="36" y="96" width="168" height="112" rx="14" fill="#FBE4E4" stroke="#A33333" stroke-width="2" /><text x="120" y="126.9" text-anchor="middle" font-size="16" font-weight="700" fill="#922B2B">Version 1</text><text x="120" y="147.4" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">groupes, cartes,</text><text x="120" y="167.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">mur, tournoi</text><text x="120" y="188.3" text-anchor="middle" font-size="16" font-weight="400" fill="#922B2B" font-style="italic">« on ne comprend rien »</text><path d="M120,208 V250" fill="none" stroke="#A33333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="120" cy="262" r="12" fill="#fff" stroke="#A33333" stroke-width="2.5"/><path d="M112,254 L128,270" stroke="#A33333" stroke-width="2.5"/><text x="140" y="268" text-anchor="start" font-size="16" font-weight="700" fill="#922B2B">refusée</text><path d="M480,494 V520" fill="none" stroke="#B5762A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ens)"/><rect x="330" y="524" width="300" height="78" rx="14" fill="#E3F4E6" stroke="#2E7D4A" stroke-width="2" /><text x="480" y="548.1" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6136">Version 2, retenue</text><text x="480" y="568.6" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">une fiche unique,</text><text x="480" y="589.1" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">les documents un par un</text><path d="M630,563 H690" fill="none" stroke="#B5762A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah-ens)"/><rect x="694" y="534" width="210" height="58" rx="14" fill="#fff" stroke="#2E7D4A" stroke-width="2" stroke-dasharray="6 5" /><text x="799" y="558.4" text-anchor="middle" font-size="16" font-weight="700" fill="#1F6136">Version 3</text><text x="799" y="578.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">variante à distance</text><text x="480" y="664" text-anchor="middle" font-size="16" font-weight="700" fill="#1A1A1A">La version la plus simple est presque toujours celle qui est retenue.</text>
</svg>
