<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 545" width="960" height="545" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">Le curseur de correction</title>
<desc id="d">Échelle de correction, de directe à indirecte : plus la correction est indirecte, plus l'élève fait lui-même le travail de correction.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="545" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Le curseur de correction</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Pourquoi ne pas tout corriger pour tout le monde ?</text><defs><linearGradient id="g5" x1="0" x2="1"><stop offset="0" stop-color="#E3F4E6"/><stop offset="1" stop-color="#2E7D4A"/></linearGradient></defs><rect x="300" y="140" width="570" height="10" rx="5" fill="url(#g5)" stroke="none" stroke-width="2" /><circle cx="330" cy="145" r="13" fill="#fff" stroke="#2E7D4A" stroke-width="3"/><text x="330" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Directe</text><circle cx="585" cy="145" r="13" fill="#fff" stroke="#2E7D4A" stroke-width="3"/><text x="585" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Mixte</text><circle cx="840" cy="145" r="13" fill="#fff" stroke="#2E7D4A" stroke-width="3"/><text x="840" y="118" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A">Indirecte</text><rect x="212" y="176" width="236" height="46" rx="8" fill="#fff" stroke="#D6D6D6" stroke-width="1.2" /><text x="330" y="205" text-anchor="middle" font-size="16" fill="#1A1A1A" xml:space="preserve">we <tspan fill="#8C8C8C" text-decoration="line-through">watch</tspan> <tspan fill="#C62828" font-weight="700">watched</tspan></text><rect x="467" y="176" width="236" height="46" rx="8" fill="#fff" stroke="#D6D6D6" stroke-width="1.2" /><text x="585" y="205" text-anchor="middle" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan fill="#8C8C8C" text-decoration="line-through">watch</tspan> <tspan fill="#C62828" font-weight="700">watched</tspan> · If I <tspan text-decoration="underline">am</tspan> [S]</text><rect x="722" y="176" width="236" height="46" rx="8" fill="#fff" stroke="#D6D6D6" stroke-width="1.2" /><text x="840" y="205" text-anchor="middle" font-size="16" fill="#1A1A1A" xml:space="preserve">we <tspan text-decoration="underline">watch</tspan> <tspan font-weight="700">[T]</tspan></text><text x="330" y="251.6" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">erreur barrée, correction donnée</text><text x="585" y="251.4" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">directe hors programme,</text><text x="585" y="271.8" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">codée sur la structure étudiée</text><text x="840" y="251.6" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">erreur soulignée et codée</text><line x1="40" y1="290" x2="920" y2="290" stroke="#E6E6E6"/><line x1="40" y1="352" x2="920" y2="352" stroke="#E6E6E6"/><line x1="40" y1="416" x2="920" y2="416" stroke="#E6E6E6"/><text x="40" y="323.6" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">Pour qui ?</text><text x="40" y="379.4" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">Ce que fait</text><text x="40" y="399.8" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">l'élève</text><text x="330" y="323.6" text-anchor="middle" font-size="16" font-weight="600" fill="#1F6136">Élève en difficulté</text><text x="330" y="379.4" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">Recopie le passage</text><text x="330" y="399.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">corrigé et l'explique</text><text x="585" y="323.6" text-anchor="middle" font-size="16" font-weight="600" fill="#1F6136">Élève intermédiaire</text><text x="585" y="379.4" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">Corrige seul·e</text><text x="585" y="399.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">les erreurs signalées</text><text x="840" y="323.6" text-anchor="middle" font-size="16" font-weight="600" fill="#1F6136">Élève avancé·e</text><text x="840" y="379.4" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">Corrige seul·e</text><text x="840" y="399.8" text-anchor="middle" font-size="16" font-weight="400" fill="#1A1A1A">et justifie</text><path d="M300,466 L880,446 L880,486 Z" fill="url(#g5)"/><path d="M880,440 L910,466 L880,492 Z" fill="#2E7D4A"/><text x="40" y="461.4" text-anchor="start" font-size="16" font-weight="700" fill="#1F6136">Effort de</text><text x="40" y="481.8" text-anchor="start" font-size="16" font-weight="700" fill="#1F6136">l'élève</text><text x="585" y="520" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">plus la correction est indirecte, plus l'élève corrige lui-même</text>
</svg>
