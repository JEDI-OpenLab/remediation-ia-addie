<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">Anatomie d'un fichier de feedback</title>
<desc id="d">Maquette d'un fichier de feedback : le texte de l'élève annoté, une ligne par critère, une réussite nommée et une priorité. Les annotations relient chaque partie aux trois questions du feedback efficace.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="650" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Anatomie d'un fichier de feedback</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Ce que reçoit chaque élève, et pourquoi sous cette forme</text><rect x="228" y="96" width="504" height="512" rx="10" fill="#fff" stroke="#D6D6D6" stroke-width="1.2" filter="url(#shadow)"/><text x="250" y="130" text-anchor="start" font-size="16" font-weight="700" fill="#5E5E5E">Ton texte</text><text x="250" y="160" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan>Dear Sam, yesterday we </tspan><tspan fill="#8C8C8C" text-decoration="line-through">watch</tspan><tspan> </tspan><tspan fill="#C62828" font-weight="700">watched</tspan><tspan> a short</tspan></text><text x="250" y="184" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan>film about a man who </tspan><tspan fill="#8C8C8C" text-decoration="line-through">search</tspan><tspan> </tspan><tspan fill="#C62828" font-weight="700">is searching</tspan></text><text x="250" y="208" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan>for happiness. Although he </tspan><tspan fill="#8C8C8C" text-decoration="line-through">buy</tspan><tspan> </tspan><tspan fill="#C62828" font-weight="700">buys</tspan><tspan> many</tspan></text><text x="250" y="232" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan>things, he is never happy. If I </tspan><tspan fill="#8C8C8C" text-decoration="line-through">am</tspan><tspan> </tspan><tspan fill="#C62828" font-weight="700">were</tspan><tspan> him,</tspan></text><text x="250" y="256" font-size="16" fill="#1A1A1A" xml:space="preserve"><tspan>I would stop </tspan><tspan fill="#8C8C8C" text-decoration="line-through">to buy</tspan><tspan> </tspan><tspan fill="#C62828" font-weight="700">buying</tspan><tspan> things.</tspan></text><line x1="250" y1="280" x2="710" y2="280" stroke="#E2E2E2" stroke-width="1.5"/><text x="250" y="312" text-anchor="start" font-size="16" font-weight="700" fill="#5E5E5E">Ton évaluation</text><text x="250" y="342" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Réalisation de la tâche</text><text x="452" y="342" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">3/4</text><text x="492" y="342" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Lettre bien adressée.</text><text x="250" y="367" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Appui sur le document</text><text x="452" y="367" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">2/4</text><text x="492" y="367" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Cite une scène précise.</text><text x="250" y="392" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Structure étudiée</text><text x="452" y="392" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">1/3</text><text x="492" y="392" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Prétérit après « if ».</text><text x="250" y="417" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Correction de la langue</text><text x="452" y="417" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">2/4</text><text x="492" y="417" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Revois les verbes en -ed.</text><text x="250" y="442" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Lexique</text><text x="452" y="442" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">2/3</text><text x="492" y="442" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Simple et juste.</text><text x="250" y="467" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Organisation</text><text x="452" y="467" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">1/2</text><text x="492" y="467" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">Plus de connecteurs.</text><text x="250" y="502" text-anchor="start" font-size="16" font-weight="700" fill="#1A1A1A">Total : 11/20 (note bonus)</text><text x="250" y="540" font-size="16" fill="#1A1A1A"><tspan font-weight="700" fill="#1A1A1A">Well done</tspan> : « although » oppose bien deux idées.</text><text x="250" y="574" font-size="16" fill="#1A1A1A"><tspan font-weight="700" fill="#1A1A1A">Next time</tspan> : après « If », mets le prétérit.</text><path d="M246,146 H238 V262 H246" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="190.5" text-anchor="end" font-size="20" font-weight="700" fill="#5E5E5E">Son texte</text><text x="222" y="212.2" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">erreurs barrées,</text><text x="222" y="232.6" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">corrections en rouge</text><path d="M246,328 H238 V472 H246" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="376.3" text-anchor="end" font-size="20" font-weight="700" fill="#1A1A1A">Où vais-je ?</text><text x="222" y="397.9" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">les critères</text><text x="222" y="418.4" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">de la grille, connus</text><text x="222" y="438.9" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">avant d'écrire</text><path d="M246,526 H238 V546 H246" fill="none" stroke="#9A9A9A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="222" y="541.6" text-anchor="end" font-size="16" font-weight="400" fill="#1A1A1A">une réussite nommée</text><path d="M714,328 H722 V510 H714" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="738" y="395.3" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Où en suis-je ?</text><text x="738" y="416.9" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">une note et une phrase</text><text x="738" y="437.4" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">par critère, puis</text><text x="738" y="457.9" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">le total</text><path d="M714,558 H722 V582 H714" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><text x="738" y="538.3" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Et ensuite ?</text><text x="738" y="559.9" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">une seule priorité,</text><text x="738" y="580.4" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">formulée comme</text><text x="738" y="600.9" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">une action</text><text x="480" y="634" text-anchor="middle" font-size="16" font-weight="400" fill="#5E5E5E">Les trois questions du feedback efficace (Hattie et Timperley, 2007). Exemple entièrement fictif.</text>
</svg>
