<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d" font-family="'Inter','Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif">
<title id="t">Reprise des priorités Next time (données fictives)</title>
<desc id="d">Graphique à barres empilées, données fictives pour une classe de 20 élèves : de la production 2 à la production 4, la part des priorités Next time corrigées passe de 4 à 10 élèves, et la part des priorités absentes de 9 à 3.</desc>
<defs><marker id="ah-ens" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#B5762A"/></marker><marker id="ah-ia" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#4A6FA5"/></marker><marker id="ah-el" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#2E7D4A"/></marker><marker id="ah-conf" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#A33333"/></marker><marker id="ah-line" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#8A8A8A"/></marker><marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#1A1A1A"/></marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/></filter>
</defs>
<rect width="960" height="420" rx="18" fill="#FFFFFF"/>
<text x="40" y="46" text-anchor="start" font-size="20" font-weight="700" fill="#1A1A1A">Reprise des priorités Next time</text><text x="40" y="72" text-anchor="start" font-size="16" font-weight="400" fill="#5E5E5E">Classe de 20 élèves, trois productions successives. Données fictives.</text><rect x="200" y="98" width="18" height="18" rx="4" fill="#CBE6D2" stroke="none" stroke-width="2" /><text x="226" y="112" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">absente</text><rect x="323" y="98" width="18" height="18" rx="4" fill="#6FB283" stroke="none" stroke-width="2" /><text x="349" y="112" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">présente</text><rect x="455" y="98" width="18" height="18" rx="4" fill="#2E7D4A" stroke="none" stroke-width="2" /><text x="481" y="112" text-anchor="start" font-size="16" font-weight="400" fill="#1A1A1A">corrigée</text><text x="184" y="169" text-anchor="end" font-size="16" font-weight="600" fill="#1A1A1A">Production 2</text><rect x="200.0" y="140" width="313.0" height="44" rx="4" fill="#CBE6D2"><title>Production 2 · absente : 9 élèves</title></rect><text x="356.5" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">9 absentes</text><rect x="515.0" y="140" width="243.0" height="44" rx="0" fill="#6FB283"><title>Production 2 · présente : 7 élèves</title></rect><text x="636.5" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">7 présentes</text><rect x="760.0" y="140" width="140.0" height="44" rx="4" fill="#2E7D4A"><title>Production 2 · corrigée : 4 élèves</title></rect><text x="830" y="168" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">4 corrigées</text><text x="184" y="241" text-anchor="end" font-size="16" font-weight="600" fill="#1A1A1A">Production 3</text><rect x="200.0" y="212" width="208.0" height="44" rx="4" fill="#CBE6D2"><title>Production 3 · absente : 6 élèves</title></rect><text x="304" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">6 absentes</text><rect x="410.0" y="212" width="278.0" height="44" rx="0" fill="#6FB283"><title>Production 3 · présente : 8 élèves</title></rect><text x="549" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">8 présentes</text><rect x="690.0" y="212" width="210.0" height="44" rx="4" fill="#2E7D4A"><title>Production 3 · corrigée : 6 élèves</title></rect><text x="795" y="240" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">6 corrigées</text><text x="184" y="313" text-anchor="end" font-size="16" font-weight="600" fill="#1A1A1A">Production 4</text><rect x="200.0" y="284" width="103.0" height="44" rx="4" fill="#CBE6D2"><title>Production 4 · absente : 3 élèves</title></rect><text x="251.5" y="312" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">3 absentes</text><rect x="305.0" y="284" width="243.0" height="44" rx="0" fill="#6FB283"><title>Production 4 · présente : 7 élèves</title></rect><text x="426.5" y="312" text-anchor="middle" font-size="16" font-weight="600" fill="#1A1A1A">7 présentes</text><rect x="550.0" y="284" width="350.0" height="44" rx="4" fill="#2E7D4A"><title>Production 4 · corrigée : 10 élèves</title></rect><text x="725" y="312" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">10 corrigées</text><line x1="200" y1="132" x2="200" y2="356" stroke="#BDBDBD" stroke-width="1"/><text x="40" y="396" text-anchor="start" font-size="16" font-weight="600" fill="#1A1A1A">Lecture attendue : la part des priorités corrigées augmente d'une production à la suivante.</text>
